<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModelCalc - Sistema de Orçamentos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="nav container">
            <h1>ModelCalc</h1>
            <div class="nav-links">
                <a href="#" id="nav-home" class="hidden">Início</a>
                <a href="#" id="nav-budgets" class="hidden">Orçamentos</a>
                <a href="#" id="nav-logout" class="hidden">Sair</a>
                <span id="user-info" class="hidden"></span>
            </div>
        </nav>
    </header>

    <main class="container">
        <!-- Login Form -->
        <div id="login-section" class="form-container">
            <h2 class="mb-3">Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email:</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Senha:</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="btn btn-primary">Entrar</button>
                <p class="mb-2">Não tem conta? <a href="#" id="show-register">Registre-se</a></p>
            </form>
        </div>

        <!-- Register Form -->
        <div id="register-section" class="form-container hidden">
            <h2 class="mb-3">Registro</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="register-name">Nome:</label>
                    <input type="text" id="register-name" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email:</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Senha:</label>
                    <input type="password" id="register-password" required>
                </div>
                <div class="form-group">
                    <label for="register-company">Empresa:</label>
                    <input type="text" id="register-company" required>
                </div>
                <div class="form-group">
                    <label for="register-type">Tipo de Usuário:</label>
                    <select id="register-type" required>
                        <option value="client">Cliente</option>
                        <option value="supplier">Fornecedor</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Registrar</button>
                <p class="mb-2">Já tem conta? <a href="#" id="show-login">Faça login</a></p>
            </form>
        </div>

        <!-- Budgets List -->
        <div id="budgets-section" class="hidden">
            <div class="card mb-3">
                <h2>Orçamentos</h2>
                <button id="new-budget-btn" class="btn btn-primary">Novo Orçamento</button>
            </div>
            
            <table class="table">
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Projeto</th>
                        <th>Valor Total</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="budgets-table-body"></tbody>
            </table>
        </div>

        <!-- New/Edit Budget Form -->
        <div id="budget-form-section" class="form-container hidden">
            <h2 id="budget-form-title" class="mb-3">Novo Orçamento</h2>
            <form id="budget-form">
                <input type="hidden" id="budget-id">
                <div class="form-group">
                    <label for="budget-project">Projeto:</label>
                    <select id="budget-project" required></select>
                </div>
                <div class="form-group">
                    <label for="budget-description">Descrição:</label>
                    <textarea id="budget-description" required></textarea>
                </div>
                
                <!-- Materials Section -->
                <div class="card mb-3">
                    <h3>Materiais</h3>
                    <div id="materials-list"></div>
                    <button type="button" class="btn btn-primary" id="add-material-btn">Adicionar Material</button>
                </div>

                <!-- Processes Section -->
                <div class="card mb-3">
                    <h3>Processos</h3>
                    <div id="processes-list"></div>
                    <button type="button" class="btn btn-primary" id="add-process-btn">Adicionar Processo</button>
                </div>

                <!-- Labor Cost -->
                <div class="form-group">
                    <label for="budget-labor-cost">Custo de Mão de Obra:</label>
                    <input type="number" id="budget-labor-cost" step="0.01" min="0" required>
                </div>

                <!-- Margin -->
                <div class="form-group">
                    <label for="budget-margin">Margem (%):</label>
                    <input type="number" id="budget-margin" step="0.1" min="0" required>
                </div>

                <div class="text-right">
                    <button type="button" class="btn btn-danger" id="cancel-budget-btn">Cancelar</button>
                    <button type="submit" class="btn btn-success">Salvar</button>
                </div>
            </form>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/budgets.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
